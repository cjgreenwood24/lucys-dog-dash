<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lucy's Dog Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#e9eef7;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,60vh);height:min(100vh,166.67vw);background:#cfe8ff;touch-action:none;border-radius:0;box-shadow:0 20px 60px rgba(40,50,90,.25)}
</style>
</head>
<body>
<canvas id="c" width="480" height="800" aria-label="Lucy's Dog Dash game"></canvas>
<script>
/* ===== Lucy's Dog Dash =====
   Core rules: Lucy is never harmed. Hits only drain the Happy meter. Cars always yield. */
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 480, H = 800, CX = W / 2, HZ = 170, PY = 650, LW = 120, LUCY_D = 0.3, MAXD = 2, PERSP = 2.2; // lower PERSP = higher camera
const STEP = 9;      // walking step rate (rad/s)
const OS = 1.8;      // obstacle sprite scale (bigger = easier to see)
const FONT = 'Nunito, "Segoe UI", system-ui, sans-serif';
const INK = '#2b2d42', SOFT = '#6b7089', CORAL = '#ff6b81';

/* ---------- persistence (safe) ---------- */
let best = 0, muted = false;
try { best = +localStorage.getItem('ldd_best') || 0; muted = localStorage.getItem('ldd_mute') === '1'; } catch (e) {}

/* ---------- audio ---------- */
let ac;
function beep(f, d, type, v, f2) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    gn.gain.setValueAtTime(v || 0.08, t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(gn); gn.connect(ac.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* ---------- state ---------- */
let state = 'menu', G;
let zoomF = 0, ZT = { z: 1, fx: 0, fy: 0, ty: 0 };   // close-up camera used when stopped or paused
const zp = (x, y) => ({ x: ZT.fx + ZT.z * (x - ZT.fx), y: ZT.ty + ZT.z * (y - ZT.fy) });
const rnd = (a, b) => a + Math.random() * (b - a);
const HAIR = ['#3d2b1f', '#6b4a2b', '#1f1f24', '#a0522d'];
const COLS = ['#ff8fa3', '#8d99ff', '#ffb86b', '#5ec2b7', '#b388eb'];
function mk(type, d, x, extra) {
  return Object.assign({ type, d, x, hit: false, go: false, tx: x, vx: Math.random() < 0.5 ? 0.25 : -0.25,
    col: COLS[Math.random() * COLS.length | 0], hair: HAIR[Math.random() * HAIR.length | 0], ph: rnd(0, 6) }, extra || {});
}
function reset() {
  G = { t: 0, dist: 0, treats: 0, happy: 5, lane: 1, tlane: 1, jt: -1, inv: 0, stumble: 0, slow: 0, stopT: 0, stopF: 0, bonus: 0, ask: null, askT: 9, parts: [], look: 0, looking: false, lookCd: 9, lookHold: 0,
        pu: { magnet: 0, shield: 0, zoom: 0 }, obs: [], spawn: 2, floats: [], scroll: 0, shake: 0, speed: 0.3 };
}
reset();
function start() {
  reset(); state = 'play';
  // make sure the player sees obstacles right away
  G.obs.push(mk('bin', 0.9, 0), mk('squirrel', 1.4, 2));
  for (let k = 0; k < 3; k++) G.obs.push(mk('treat', 0.9 + k * 0.13, 1));
  beep(500, 0.15, 'triangle', 0.08, 800);
}
function score() { return Math.floor(G.dist) + G.treats * 10 + G.bonus; }

/* ---------- projection ---------- */
function proj(d, lane) {
  const s = 1 / (1 + PERSP * d);
  return { s, x: CX + (lane - 1) * LW * s, y: HZ + (PY - HZ) * s };
}

/* ---------- spawning ---------- */
function spawnRow() {
  if (Math.random() < 0.1) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    G.obs.push(mk('road', MAXD, null, { dir, u: dir === 1 ? -1.2 : 3.2, cs: rnd(0.9, 1.4) }));
    G.spawn += 0.5;
    return;
  }
  const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
  const n = Math.random() < Math.min(0.3, 0.06 + G.t / 400) ? 2 : 1;
  const types = ['bin', 'puddle', 'person', 'squirrel', 'squirrel'];
  for (let i = 0; i < n; i++) G.obs.push(mk(types[Math.random() * types.length | 0], MAXD, lanes[i]));
  if (n < 3 && Math.random() < 0.16) {
    const kinds = ['ball', 'toy', 'zoom'].concat(G.happy < 5 ? ['heart', 'heart'] : []);
    G.obs.push(mk('power', MAXD, lanes[n], { kind: kinds[Math.random() * kinds.length | 0] }));
  } else if (n < 3 && Math.random() < 0.75) {
    for (let k = 0; k < 3; k++) G.obs.push(mk('treat', MAXD + k * 0.13, lanes[n], { ph: k }));
  }
}

/* ---------- update ---------- */
const MSG = { bin: 'Oops! Bin!', puddle: 'Splash!', person: 'Sorry!', squirrel: 'Squirrel!' };
function say(t, life) { G.floats.push({ text: t, y: 400, life: life || 1 }); }
function onHit(o) {
  o.hit = true;
  if (G.inv > 0) return;
  if (G.pu.shield > 0) { say('Boing!'); beep(500, 0.15, 'triangle', 0.07, 900); return; }
  G.happy--; G.inv = 1.3; G.stumble = 0.6; G.slow = 1; G.shake = 0.3;
  say(MSG[o.type] || 'Oops!');
  beep(220, 0.25, 'square', 0.06, 110);
  if (G.happy <= 0) endRun();
}
function endRun() {
  state = 'over';
  const sc = score();
  if (sc > best) { best = sc; try { localStorage.setItem('ldd_best', best); } catch (e) {} }
  beep(400, 0.5, 'triangle', 0.08, 200);
}
function update(dt) {
  if (state === 'pause') return;            // everything freezes while paused, including Lucy and Jane
  G.t += dt;
  if (state !== 'play') { G.scroll += 0.3 * dt; return; }
  G.speed = 0.3 + Math.min(0.3, G.t / 200);
  G.stopT = Math.max(0, G.stopT - dt);
  G.stopF += ((G.stopT > 0 ? 1 : 0) - G.stopF) * Math.min(1, dt * 6);
  // Lucy faces forward but glances back now and then (and while she is asking for a fuss).
  if (!G.looking) { G.lookCd -= dt; if (G.lookCd <= 0) { G.looking = true; G.lookHold = 1.2; } }
  else { G.lookHold -= dt; if (G.lookHold <= 0 && !G.ask) { G.looking = false; G.lookCd = rnd(12, 20); } }
  G.look += ((G.looking || G.ask ? 1 : 0) - G.look) * Math.min(1, dt * 4);
  // Lucy occasionally asks for a stroke or a treat. No penalty if ignored: she just says "maybe next time".
  if (!G.ask) {
    G.askT -= dt * (1 - G.stopF);
    if (G.askT <= 0) { G.ask = { kind: G.treats > 0 && Math.random() < 0.5 ? 'treat' : 'stroke', t: 10 }; beep(700, 0.15, 'triangle', 0.06, 900); }
  } else {
    G.ask.t -= dt;
    if (G.ask.t <= 0) { G.ask = null; G.askT = rnd(14, 22); say('Maybe next time!'); }
    else if (G.stopF > 0.5) G.stopT = Math.max(G.stopT, 0.5);   // stay put while Lucy is being fussed
  }
  const sp = G.speed * (1 - 0.5 * G.slow) * (G.pu.zoom > 0 ? 1.4 : 1) * (1 - G.stopF);
  G.slow = Math.max(0, G.slow - dt * 1.2);
  G.dist += sp * dt * 80 * (G.pu.zoom > 0 ? 2 : 1);
  for (const k in G.pu) G.pu[k] = Math.max(0, G.pu[k] - dt);
  G.scroll += sp * dt;
  G.lane += (G.tlane - G.lane) * Math.min(1, dt * 14);
  if (G.jt >= 0) { G.jt += dt / 0.65; if (G.jt >= 1) G.jt = -1; }
  G.inv = Math.max(0, G.inv - dt);
  G.stumble = Math.max(0, G.stumble - dt);
  G.shake = Math.max(0, G.shake - dt);
  const h = G.jt < 0 ? 0 : Math.sin(G.jt * Math.PI);

  G.spawn -= dt * sp / 0.6;
  if (G.spawn <= 0) { G.spawn = Math.max(2.2, 4.0 - G.t / 120) * rnd(0.9, 1.5); spawnRow(); }   // calm, well-spaced obstacles

  for (const o of G.obs) {
    o.d -= sp * dt;
    if (o.type === 'squirrel') {
      if (!o.go && o.d < 1.3) { o.go = true; o.tx = [0, 1, 2].filter(l => l !== Math.round(o.x))[Math.random() * 2 | 0]; }
      if (o.go) o.x += Math.sign(o.tx - o.x) * Math.min(Math.abs(o.tx - o.x), 1.6 * dt);
    } else if (o.type === 'person') {
      o.x += o.vx * dt;
      if (o.x < 0 || o.x > 2) { o.vx = -o.vx; o.x = Math.max(0, Math.min(2, o.x)); }
    } else if (o.type === 'road') {
      if (!o.go && o.d < 0.8) o.go = true;
      if (o.go) {
        // Cars always yield: they stop short of Lucy's lane and wait (or politely reverse) until she has crossed.
        const heading = o.dir * (G.lane - o.u) > -0.3;
        const close = Math.abs(o.u - G.lane) < 1.25 && heading;
        if (close && o.d < 1.0 && o.d > -0.1) {
          o.wait = true;
          if (Math.abs(o.u - G.lane) < 1.0) o.u -= o.dir * o.cs * dt;
        } else { o.wait = false; o.u += o.dir * o.cs * dt; }
      }
    }
    if (o.type === 'treat' && G.pu.magnet > 0 && o.d < 1.5 && !o.hit) o.x += Math.sign(G.lane - o.x) * Math.min(Math.abs(G.lane - o.x), 4 * dt);
    if (o.hit || o.type === 'road') continue;
    if (Math.abs(o.d - LUCY_D) >= 0.07) continue;
    if (o.type === 'treat') {
      if (Math.abs(o.x - G.lane) < 0.6) { o.hit = true; G.treats++; beep(800, 0.1, 'sine', 0.07, 1300); }
    } else if (o.type === 'power') {
      if (Math.abs(o.x - G.lane) < 0.6) {
        o.hit = true;
        const info = { ball: ['Treat magnet!', 'magnet', 8], toy: ['Chew toy shield!', 'shield', 6], zoom: ['Zoomies! x2 score', 'zoom', 5] }[o.kind];
        if (o.kind === 'heart') { G.happy = Math.min(5, G.happy + 1); say('Happy Lucy!'); }
        else { G.pu[info[1]] = info[2]; say(info[0], 1.2); }
        beep(600, 0.3, 'triangle', 0.08, 1500);
      }
    } else if (Math.abs(o.x - G.lane) < 0.55) {
      const jumpable = o.type === 'bin' || o.type === 'puddle';
      if (!(jumpable && h > 0.4)) onHit(o);
    }
  }
  G.obs = G.obs.filter(o => o.d > -0.4 && !((o.type === 'treat' || o.type === 'power') && o.hit));
  for (const p of G.parts) { p.life -= dt; p.dy -= 40 * dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floats) { f.life -= dt; f.y -= 30 * dt; }
  G.floats = G.floats.filter(f => f.life > 0);
}

/* ---------- drawing helpers ---------- */
function ell(x, y, rx, ry, col, rot) { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832); g.fill(); }
function rr(x, y, w, h, r, col) { g.fillStyle = col; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
function shadow(x, y, rx, ry) { ell(x, y, rx, ry, 'rgba(40,50,90,.16)'); }
function heart(x, y, sz, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(x, y + sz * 0.35);
  g.bezierCurveTo(x - sz, y - sz * 0.5, x - sz * 0.5, y - sz * 1.1, x, y - sz * 0.45);
  g.bezierCurveTo(x + sz * 0.5, y - sz * 1.1, x + sz, y - sz * 0.5, x, y + sz * 0.35); g.fill();
}
function bone(x, y, sz, col) {
  rr(x - sz, y - sz * 0.22, sz * 2, sz * 0.44, sz * 0.2, col);
  for (const dx of [-1, 1]) for (const dy of [-0.3, 0.3]) ell(x + dx * sz, y + dy * sz, sz * 0.3, sz * 0.3, col);
}
function text(t, x, y, size, col, align) {
  g.font = '800 ' + size + 'px ' + FONT; g.textAlign = align || 'center'; g.textBaseline = 'alphabetic';
  g.fillStyle = col; g.fillText(t, x, y);
}
function pill(x, y, w, h, r, fill) {
  g.save(); g.shadowColor = 'rgba(40,50,90,.18)'; g.shadowBlur = 14; g.shadowOffsetY = 4;
  rr(x, y, w, h, r == null ? h / 2 : r, fill || 'rgba(255,255,255,.82)'); g.restore();
}

/* ---------- scenery ---------- */
const skyline = Array.from({ length: 12 }, (_, i) => ({ x: i * 42 - 10, w: 38, h: 28 + Math.random() * 46, c: ['#e7e1f3', '#f1dfe6', '#dce8f1', '#e3ecdf'][i % 4] }));
function drawScene() {
  const sky = g.createLinearGradient(0, 0, 0, HZ); sky.addColorStop(0, '#9fd0ff'); sky.addColorStop(0.6, '#d6ebff'); sky.addColorStop(1, '#fff0e0');
  g.fillStyle = sky; g.fillRect(0, 0, W, HZ + 2);
  const sun = g.createRadialGradient(372, 80, 4, 372, 80, 80); sun.addColorStop(0, 'rgba(255,245,200,1)'); sun.addColorStop(0.35, 'rgba(255,238,180,.85)'); sun.addColorStop(1, 'rgba(255,238,180,0)');
  g.fillStyle = sun; g.fillRect(272, 0, 208, 180);
  for (const [cx0, cy0, sc, sp0] of [[80, 60, 1, 6], [250, 110, 0.7, 4], [430, 40, 0.6, 5]]) {
    const cx = ((cx0 + G.t * sp0) % (W + 160)) - 80;
    for (const [dx, dy, r] of [[0, 0, 22], [24, 6, 18], [-24, 8, 16], [8, -10, 16]]) ell(cx + dx * sc, cy0 + dy * sc, r * sc, r * sc * 0.8, 'rgba(255,255,255,.85)');
  }
  for (const b of skyline) g.fillStyle = b.c, g.beginPath(), g.roundRect(b.x, HZ - b.h, b.w, b.h + 4, [6, 6, 0, 0]), g.fill();
  ell(110, HZ + 14, 200, 44, '#cfe9d6'); ell(390, HZ + 16, 230, 50, '#bfe1c8');
  const gr = g.createLinearGradient(0, HZ, 0, H); gr.addColorStop(0, '#c4e8b8'); gr.addColorStop(1, '#9fd490');
  g.fillStyle = gr; g.fillRect(0, HZ, W, H - HZ);
  const sB = 1.35, yB = HZ + (PY - HZ) * sB;
  const strip = (a, b, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(CX + a * LW * 0.0001, HZ); g.lineTo(CX + b * LW * 0.0001, HZ);
    g.lineTo(CX + b * LW * sB, yB); g.lineTo(CX + a * LW * sB, yB); g.closePath(); g.fill(); };
  strip(-3.9, -1.8, '#5d6575');     // road
  strip(-1.85, 1.85, '#e4dccf');    // kerb
  strip(-1.7, 1.7, '#f7f2ec');      // pavement
  const M = 0.35, off = G.scroll % M;
  g.strokeStyle = '#e8e1d6';
  for (let k = 0; k < 10; k++) {
    const d = k * M - off; if (d < -0.2) continue;
    const p = proj(d, 1); g.lineWidth = 2 * p.s + 0.5;
    g.beginPath(); g.moveTo(CX - 1.7 * LW * p.s, p.y); g.lineTo(CX + 1.7 * LW * p.s, p.y); g.stroke();
  }
  const D = 0.5, off2 = G.scroll % D;
  for (let k = 0; k < 8; k++) {
    const d = k * D - off2; if (d < -0.2) continue;
    const a = proj(d, 1), b = proj(d + 0.2, 1); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 5 * a.s + 0.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(CX - 2.85 * LW * a.s, a.y); g.lineTo(CX - 2.85 * LW * b.s, b.y); g.stroke();
  }
  g.lineCap = 'butt';
  const T = 0.55, off3 = G.scroll % T;
  for (let k = 8; k >= 0; k--) {
    const d = k * T - off3 + 0.1; if (d < -0.2) continue;
    const p = proj(d, 1), x = CX + 2.75 * LW * p.s, tx = x;
    shadow(tx + 14 * p.s, p.y, 46 * p.s, 10 * p.s);
    rr(tx - 5 * p.s, p.y - 70 * p.s, 10 * p.s, 70 * p.s, 3 * p.s, '#8a6a4a');
    ell(tx, p.y - 104 * p.s, 44 * p.s, 46 * p.s, k % 2 ? '#7cc47f' : '#6db574');
    ell(tx - 14 * p.s, p.y - 112 * p.s, 22 * p.s, 22 * p.s, 'rgba(255,255,255,.18)');
  }
  const L = 0.8, off4 = G.scroll % L;                     // lamp posts on the kerb
  for (let k = 5; k >= 0; k--) {
    const d = k * L - off4 + 0.3; if (d < -0.2) continue;
    const p = proj(d, 1), x = CX - 1.95 * LW * p.s;
    rr(x - 2.5 * p.s, p.y - 120 * p.s, 5 * p.s, 120 * p.s, 2 * p.s, '#8a93a6'); ell(x + 6 * p.s, p.y - 122 * p.s, 11 * p.s, 8 * p.s, '#fff3c4');
  }
}

/* ---------- characters ---------- */
const DOG = '#24242c', DOG_HI = '#363642', WHITE = '#fafafa';
/* shaded helpers for a more realistic look */
function gell(x, y, rx, ry, c1, c2) {
  g.save(); g.translate(x, y); g.scale(rx, ry);
  const gr = g.createRadialGradient(-0.3, -0.4, 0.05, 0, 0, 1); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, 6.2832); g.fill(); g.restore();
}
function grr(x, y, w, h, r, col) {
  rr(x, y, w, h, r, col);
  const gr = g.createLinearGradient(x, y, x + w, y);
  gr.addColorStop(0, 'rgba(255,255,255,.24)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.22)');
  g.fillStyle = gr; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill();
}
function curls(cx, cy, rx, ry, n, col, sz, seed) {
  g.strokeStyle = col; g.lineWidth = 1.6; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.2832 + seed, px = cx + Math.cos(a) * rx * (0.65 + 0.28 * Math.sin(i * 2.3)), py = cy + Math.sin(a) * ry * (0.65 + 0.28 * Math.sin(i * 1.7));
    g.beginPath(); g.arc(px, py, sz, a, a + 4.2); g.stroke();
  }
  g.lineCap = 'butt';
}
function drawLucy(x, y, s, h) {
  // Lucy faces forward (we see her from behind) and every so often turns her head to look back at Jane.
  const k = s * 1.5, ph = Math.sin(G.t * STEP * 1.3) * (1 - G.stopF), lk = G.look, t = lk * lk * (3 - 2 * lk), psi = t * 2.0;   // psi = how far her head has turned (radians, 0 = facing away)
  shadow(x + 4 * k * t, y + 2 * s, 30 * k, 8 * k);
  g.save(); g.translate(x, y - h * 70 * s); g.scale(k, k * (1 - 0.08 * G.stopF));
  if (G.stumble > 0) g.rotate(Math.sin(G.t * 40) * 0.2);
  if (G.inv > 0 && Math.floor(G.t * 12) % 2) g.globalAlpha = 0.55;
  const bob = state === 'play' ? ph * 1.5 : 0, FUR = 'rgba(135,135,155,.55)', D1 = '#46465a', D2 = '#14141a';
  for (const sd of [-1, 1]) { const lift = -ph * 3 * sd; gell(sd * 13, -33 + lift, 5, 15, '#3a3a46', '#17171c'); gell(sd * 13, -20 + lift, 6, 4, '#ffffff', '#dcdce4'); }   // front legs (further away, peeking out either side)
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.2832; gell(Math.cos(a) * 13, -32 + bob + Math.sin(a) * 15, 4.5, 4.5, '#42424f', '#15151a'); }                  // light coat edge
  gell(0, -32 + bob, 14.5, 17.5, D1, D2);                                                                                                                         // lean body
  gell(-4, -31 + bob, 6.5, 6, '#ffffff', '#d6d6e0');
  curls(0, -32 + bob, 13, 15, 12, FUR, 2.8, 0);
  for (const sd of [-1, 1]) { const lift = ph * 3 * sd; gell(sd * 10, -14 + lift, 5.5, 15, '#3a3a46', '#17171c'); gell(sd * 10, -3 + lift, 6.5, 4, '#ffffff', '#dcdce4'); }   // hind legs (nearest)
  gell(0, -22 + bob, 6, 9, '#40404c', '#17171c'); gell(0, -29 + bob, 4.2, 4.8, '#ffffff', '#e4e4ea'); curls(0, -22 + bob, 5, 7, 6, FUR, 1.8, 0);   // curly tail raised at the rear, nearest the camera
  const sp_ = Math.sin(psi), cp_ = Math.cos(psi), nx = 8 * sp_;
  gell(nx, -50 + bob, 11, 10, '#3a3a46', '#16161b'); ell(nx, -47 + bob, 11, 3, CORAL); ell(nx, -44 + bob, 2.4, 2.4, '#ffd166');   // neck + collar swing round
  g.save(); g.translate(13 * sp_, -62 + bob + 2 * sp_); g.rotate(-0.14 * sp_);                                       // head swings round and tilts a little
  for (let i = 0; i < 6; i++) gell(-12.5 + i * 5 + 3 * sp_, -13 + Math.abs(Math.sin(i * 1.4)) * 3, 6.5, 6.5, '#40404c', '#16161b');   // topknot
  const ears = [-1, 1].map(sd => { const a = sd * 1.75 + psi; return { sd, a, depth: Math.cos(a) }; }).sort((p, q) => q.depth - p.depth);
  const ear = e => { const w = 4 + 3.5 * Math.abs(Math.sin(e.a)), ex = 14.5 * Math.sin(e.a); gell(ex, 8, w, 16, '#2c2c36', '#101014'); curls(ex, 8, w * 0.7, 13, 8, FUR, 2.3, e.sd); };
  ear(ears[0]);                                                                                                       // far ear first
  gell(0, 0, 13 + 2 * Math.abs(sp_), 12.5, '#44444f', '#18181d');                                                       // head (plain dark from behind)
  curls(0, -2, 11, 10, 8, FUR, 2.4, 1);
  if (cp_ < 0.25) {                                                                                                   // the face appears around the edge as the head turns
    const rx = 5 + 5 * Math.abs(sp_);
    gell(8 * sp_, -10, 6, 5, '#ffffff', '#e2e2ea');                                                                    // white blaze
    gell(14 * sp_, 4, rx, 7, '#3a3a46', '#17171c'); gell(14.5 * sp_, 7, rx * 0.85, 5, '#ffffff', '#dcdce4');           // snout + white muzzle
    ell(21 * sp_, 1.5, 3.7, 3.1, '#0d0d10'); ell(20 * sp_, 0.5, 1, 0.8, 'rgba(255,255,255,.7)');                       // nose
    ell(16 * sp_, 12.5, 3, 4.2, '#ff8fa3');                                                                             // tongue
    for (const sd of [-1, 1]) { const a = sd * 0.6 + psi; if (Math.cos(a) < 0.05) { const ex = 11 * Math.sin(a); ell(ex, -3.5, 3, 3.3, '#0d0d10'); ell(ex + 1, -4.7, 1, 1, '#ffffff'); } }
  }
  ear(ears[1]);                                                                                                       // near ear last
  g.restore();
  g.restore();
}
function drawJane(x, y, s, h) {
  const ph = Math.sin(G.t * STEP), a = state === 'play' ? ph * 4 * (1 - G.stopF) : 0, sw = Math.sin(G.t * STEP) * 3 * (1 - G.stopF);
  shadow(x, y + 2 * s, 34 * s, 9 * s);
  g.save(); g.translate(x, y - h * 70 * s); g.scale(s * 0.9, s * 0.9);
  if (G.stumble > 0) g.rotate(Math.sin(G.t * 40) * 0.06);
  if (G.inv > 0 && Math.floor(G.t * 12) % 2) g.globalAlpha = 0.55;
  grr(-13, -74 - a, 11, 72 + a, 5, '#4a5568'); grr(2, -74 + a, 11, 72 - a, 5, '#4a5568');          // leggings
  gell(-8, -2 - a, 10, 5.5, '#ffffff', '#cfcfd9'); gell(8, -2 + a, 10, 5.5, '#ffffff', '#cfcfd9'); // trainers
  grr(-20, -132, 40, 64, 15, '#52b8ad');                                                           // jacket
  g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, -126); g.lineTo(0, -72); g.stroke();   // back seam
  grr(-24, -126, 9, 40, 4.5, '#47a79d'); grr(15, -126, 9, 38, 4.5, '#47a79d');                    // arms
  grr(-17, -76, 34, 8, 4, '#47a79d');                                                              // hem
  gell(19, -87, 5, 5, '#f9dcc3', '#d9ad8e');                                                       // hand
  rr(-4, -138, 8, 12, 3, '#e8bf9f');                                                               // neck
  gell(sw, -120, 10, 25, '#dcc070', '#a8842f');                                                    // long hair down her back
  g.strokeStyle = 'rgba(120,90,30,.4)'; g.lineWidth = 1.3;
  for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(i * 3, -150); g.quadraticCurveTo(i * 3 + sw * 0.4, -130, i * 2.6 + sw, -98); g.stroke(); }
  gell(0, -147, 15.5, 16.5, '#e3c776', '#ab8734');                                                 // head (hair)
  ell(-5, -154, 7, 4, 'rgba(255,245,200,.55)');                                                    // highlight
  ell(-14.5, -143, 2.4, 4, '#f4cdb0'); ell(14.5, -143, 2.4, 4, '#f4cdb0');                         // ears
  g.restore();
}
function drawLead(jx, jy, lx, ly) {
  g.strokeStyle = CORAL; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(jx, jy);
  g.quadraticCurveTo((jx + lx) / 2, Math.max(jy, ly) + 16, lx, ly); g.stroke(); g.lineCap = 'butt';
}

/* ---------- obstacles ---------- */
function drawObs(o) {
  const lane = o.type === 'road' ? 1 : o.x, p = proj(o.d, lane), s = p.s * (o.type === 'road' ? 1 : OS), x = p.x, y = p.y;
  switch (o.type) {
    case 'bin':
      shadow(x, y, 30 * s, 8 * s);
      grr(x - 22 * s, y - 60 * s, 44 * s, 60 * s, 7 * s, '#4caf7d'); grr(x - 26 * s, y - 68 * s, 52 * s, 12 * s, 6 * s, '#3a9a69');
      rr(x - 14 * s, y - 42 * s, 28 * s, 6 * s, 3 * s, '#86d6aa'); rr(x - 6 * s, y - 76 * s, 12 * s, 6 * s, 3 * s, '#3a9a69');
      ell(x - 15 * s, y, 6 * s, 5 * s, '#2b2d42'); ell(x + 15 * s, y, 6 * s, 5 * s, '#2b2d42'); break;
    case 'puddle':
      ell(x, y - 2 * s, 48 * s, 14 * s, '#8fd0f5'); ell(x, y - 2 * s, 34 * s, 9 * s, '#b4e1fa'); ell(x - 10 * s, y - 4 * s, 14 * s, 3.5 * s, 'rgba(255,255,255,.85)'); break;
    case 'person': {
      const w = Math.sin(G.t * STEP + o.ph) * 4 * s;
      shadow(x, y, 26 * s, 7 * s);
      grr(x - 13 * s, y - 55 * s, 11 * s, 55 * s + w, 5 * s, '#4a5568'); grr(x + 2 * s, y - 55 * s, 11 * s, 55 * s - w, 5 * s, '#4a5568');
      grr(x - 18 * s, y - 110 * s, 36 * s, 58 * s, 12 * s, o.col); ell(x, y - 126 * s, 14 * s, 14 * s, '#f4cdb0');
      ell(x, y - 132 * s, 15 * s, 10 * s, o.hair); ell(x - 5 * s, y - 125 * s, 1.8 * s, 2.2 * s, '#2b2d42'); ell(x + 5 * s, y - 125 * s, 1.8 * s, 2.2 * s, '#2b2d42');
      rr(x + 18 * s, y - 86 * s, 16 * s, 22 * s, 4 * s, '#ffd166'); break; }
    case 'squirrel': {
      const hop = Math.abs(Math.sin(G.t * 10 + o.ph)) * 7 * s;
      shadow(x, y, 22 * s, 6 * s);
      ell(x + 16 * s, y - 32 * s - hop, 13 * s, 24 * s, '#c2692a', 0.35); ell(x + 18 * s, y - 38 * s - hop, 8 * s, 16 * s, '#e0904e', 0.35);   // bushy tail
      gell(x, y - 18 * s - hop, 16 * s, 14 * s, '#f4a259', '#c9692a'); ell(x - 3 * s, y - 14 * s - hop, 9 * s, 8 * s, '#f6c79a');
      gell(x - 7 * s, y - 36 * s - hop, 11 * s, 10 * s, '#f4a259', '#c9692a');
      ell(x - 13 * s, y - 45 * s - hop, 3.5 * s, 5 * s, '#c2692a'); ell(x - 9 * s, y - 37 * s - hop, 2.3 * s, 2.3 * s, '#2b2d42');
      ell(x - 13 * s, y - 33 * s - hop, 1.6 * s, 1.4 * s, '#2b2d42'); break; }
    case 'treat': {
      const b = Math.sin(G.t * 6 + o.ph) * 4 * s, yy = y - 18 * s - b;
      ell(x, yy, 20 * s, 20 * s, 'rgba(255,214,102,.45)'); bone(x, yy, 12 * s, '#fff'); break; }
    case 'power': {
      const b = Math.sin(G.t * 5) * 5 * s, yy = y - 32 * s - b, r = 24 * s;
      ell(x, yy, r * 1.6, r * 1.6, 'rgba(255,255,255,.5)'); ell(x, yy, r * 1.15, r * 1.15, '#fff');
      if (o.kind === 'ball') { ell(x, yy, r * 0.8, r * 0.8, '#d6f23a'); g.strokeStyle = '#fff'; g.lineWidth = 2 * s; g.beginPath(); g.arc(x - r * 0.9, yy, r * 0.8, -0.8, 0.8); g.stroke(); }
      else if (o.kind === 'toy') { rr(x - r * 0.85, yy - r * 0.38, r * 1.7, r * 0.76, r * 0.38, '#ff7b00'); ell(x - r * 0.85, yy, r * 0.3, r * 0.48, '#ff7b00'); ell(x + r * 0.85, yy, r * 0.3, r * 0.48, '#ff7b00'); }
      else if (o.kind === 'zoom') { g.fillStyle = '#8a4fff'; g.beginPath(); g.moveTo(x + r * 0.2, yy - r * 0.9); g.lineTo(x - r * 0.6, yy + r * 0.1); g.lineTo(x, yy + r * 0.1); g.lineTo(x - r * 0.2, yy + r * 0.9); g.lineTo(x + r * 0.6, yy - r * 0.15); g.lineTo(x, yy - r * 0.15); g.closePath(); g.fill(); }
      else heart(x, yy + r * 0.1, r * 0.8, '#ff4d6d');
      break; }
    case 'road': {
      const near = proj(o.d - 0.09, 1), far = proj(o.d + 0.09, 1);
      g.fillStyle = '#5d6575'; g.fillRect(0, far.y, W, near.y - far.y);
      for (let i = -4; i < 10; i++) rr(CX + (i * 0.5 - 1.5) * LW * s, far.y + (near.y - far.y) * 0.1, 0.25 * LW * s, (near.y - far.y) * 0.8, 3 * s, '#fff');
      if (o.go && o.u > -1.6 && o.u < 3.6) {
        const cx = CX + (o.u - 1) * LW * s, cw = 130 * s, ch = 50 * s, cy = (near.y + far.y) / 2;
        shadow(cx, cy + 2 * s, cw * 0.55, 8 * s);
        rr(cx - cw / 2, cy - ch, cw, ch, 12 * s, '#ff6b81'); rr(cx - cw * 0.3, cy - ch * 1.65, cw * 0.6, ch * 0.8, 10 * s, '#ff8fa3');
        rr(cx - cw * 0.25, cy - ch * 1.55, cw * 0.5, ch * 0.55, 7 * s, '#cfeaff');
        ell(cx - cw * 0.3, cy, 10 * s, 10 * s, '#2b2d42'); ell(cx + cw * 0.3, cy, 10 * s, 10 * s, '#2b2d42');
        if (o.wait) {
          rr(cx - cw * 0.46, cy - ch * 0.75, 11 * s, 9 * s, 3 * s, '#ff2d2d'); rr(cx + cw * 0.46 - 11 * s, cy - ch * 0.75, 11 * s, 9 * s, 3 * s, '#ff2d2d');
          const fs = Math.max(11, 16 * s); g.font = '800 ' + fs + 'px ' + FONT; const tw = g.measureText('Go ahead, Lucy!').width + 18;
          pill(cx - tw / 2, cy - ch * 2.45, tw, fs + 12, null, 'rgba(255,255,255,.92)'); text('Go ahead, Lucy!', cx, cy - ch * 2.45 + fs + 3, fs, INK);
        }
      }
      break; }
  }
}

/* ---------- UI ---------- */
function drawUI() {
  if (G.pu.zoom > 0) { g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3; g.lineCap = 'round'; for (let i = 0; i < 14; i++) { const x = (i * 97 + G.t * 900) % W, y = (i * 61 + G.t * 500) % H; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 40); g.stroke(); } g.lineCap = 'butt'; }
  pill(16, 16, 124, 46); text(String(score()), 78, 48, 28, INK);
  pill(16, 70, 84, 34); bone(38, 87, 10, '#ffb703'); text(String(G.treats), 78, 94, 18, INK);
  pill(CX - 100, 16, 200, 46);
  for (let i = 0; i < 5; i++) heart(CX - 72 + i * 36, 40, 12, i < G.happy ? '#ff4d6d' : 'rgba(43,45,66,.15)');
  g.save(); g.shadowColor = 'rgba(40,50,90,.18)'; g.shadowBlur = 14; g.shadowOffsetY = 4; ell(W - 38, 38, 23, 23, 'rgba(255,255,255,.82)'); g.restore();
  text(muted ? '\u{1F507}' : '\u{1F50A}', W - 38, 46, 20, INK);
  g.save(); g.shadowColor = 'rgba(40,50,90,.18)'; g.shadowBlur = 14; g.shadowOffsetY = 4; ell(W - 94, 38, 23, 23, 'rgba(255,255,255,.82)'); g.restore();
  rr(W - 101, 28, 5, 20, 2, INK); rr(W - 91, 28, 5, 20, 2, INK);                    // pause button
  if (G.ask) {
    const lp = proj(LUCY_D, G.lane), txt = G.ask.kind === 'treat' ? 'Treat, please?' : 'Stroke, please?';
    g.font = '800 18px ' + FONT; const tw = g.measureText(txt).width + 32, bx = zp(lp.x, 0).x, by = zp(0, lp.y - 150 * lp.s).y;
    pill(bx - tw / 2, by - 34, tw, 36, 18, 'rgba(255,255,255,.97)');
    g.fillStyle = 'rgba(255,255,255,.97)'; g.beginPath(); g.moveTo(bx - 8, by + 1); g.lineTo(bx + 8, by + 1); g.lineTo(bx, by + 12); g.fill();
    text(txt, bx, by - 10, 18, INK);
    const stopped = G.stopF > 0.5;
    pill(CX - 150, 716, 300, 46, 23, stopped ? CORAL : 'rgba(255,255,255,.92)');
    text(stopped ? (G.ask.kind === 'treat' ? 'Tap to give a treat' : 'Tap to give a stroke') : 'Swipe down to stop for Lucy', CX, 746, 18, stopped ? '#fff' : INK);
  }
  const eff = [['magnet', 'Magnet', 8, '#d6f23a'], ['shield', 'Shield', 6, '#5ac8fa'], ['zoom', 'Zoomies', 5, '#8a4fff']];
  let ex = 16;
  for (const [k, label, max, col] of eff) {
    if (G.pu[k] <= 0) continue;
    pill(ex, 114, 92, 38, 14); text(label, ex + 46, 131, 14, INK); rr(ex + 12, 138, 68, 6, 3, 'rgba(43,45,66,.12)'); rr(ex + 12, 138, 68 * G.pu[k] / max, 6, 3, col); ex += 100;
  }
  if (G.stopF > 0.6) { pill(CX - 60, 76, 120, 32); text('Waiting…', CX, 98, 16, SOFT); }
  for (const f of G.floats) {
    g.globalAlpha = Math.min(1, f.life * 2); g.font = '800 24px ' + FONT; const tw = g.measureText(f.text).width + 36;
    pill(CX - tw / 2, f.y - 30, tw, 42); text(f.text, CX, f.y - 2, 24, INK); g.globalAlpha = 1;
  }
}
function card(title, tsize, rows, btn, h) {
  g.fillStyle = 'rgba(43,45,66,.38)'; g.fillRect(0, 0, W, H);
  const y0 = 150; pill(36, y0, 408, h, 32, 'rgba(255,255,255,.96)');
  text(title, CX, y0 + 70, tsize, INK);
  rows.forEach((r, i) => text(r[0], CX, y0 + 120 + i * 34, r[1] || 18, r[2] || SOFT));
  pill(CX - 130, y0 + h - 84, 260, 56, 28, CORAL); text(btn, CX, y0 + h - 48, 22, '#fff');
}

/* ---------- render ---------- */
function render() {
  g.save();
  if (G.shake > 0) g.translate(rnd(-4, 4), rnd(-4, 4));
  const jz = proj(0, G.lane), zfx = jz.x - 25, zfy = jz.y - 90, zz = 1 + 0.55 * zoomF;
  ZT = { z: zz, fx: zfx, fy: zfy, ty: zfy + (480 - zfy) * zoomF };
  g.translate(zfx, ZT.ty); g.scale(zz, zz); g.translate(-zfx, -zfy);
  drawScene();
  const h = G.jt < 0 ? 0 : Math.sin(G.jt * Math.PI);
  const items = G.obs.filter(o => o.d < MAXD + 0.5).map(o => ({ d: o.d, f: () => drawObs(o) }));
  const lp = proj(LUCY_D, G.lane), jp = proj(0, G.lane);
  items.push({ d: LUCY_D, f: () => {
    const cy = lp.y - h * 70 * lp.s - 60 * lp.s;
    if (G.pu.shield > 0 && (G.pu.shield > 1.5 || Math.floor(G.t * 10) % 2)) { g.strokeStyle = 'rgba(90,200,250,.9)'; g.fillStyle = 'rgba(140,220,255,.25)'; g.lineWidth = 3; g.beginPath(); g.arc(lp.x, cy, 56 * lp.s, 0, 6.2832); g.fill(); g.stroke(); }
    if (G.pu.magnet > 0) { g.strokeStyle = 'rgba(160,200,20,.8)'; g.lineWidth = 2; g.beginPath(); g.arc(lp.x, cy, (62 + (G.t * 60) % 30) * lp.s, 0, 6.2832); g.stroke(); }
    drawLucy(lp.x, lp.y, lp.s, h);
  } });
  items.push({ d: 0, f: () => {
    drawJane(jp.x - 50, jp.y, jp.s, h);
    drawLead(jp.x - 50 + 19 * 0.9, jp.y - h * 70 - 88 * 0.9, lp.x + 8 * Math.sin(2 * G.look * G.look * (3 - 2 * G.look)) * lp.s * 1.5, lp.y - h * 70 * lp.s - 47 * lp.s * 1.5);
  } });
  items.sort((a, b) => b.d - a.d).forEach(i => i.f());
  for (const p of G.parts) { g.globalAlpha = Math.min(1, p.life * 1.5); heart(lp.x + p.dx, lp.y - 90 * lp.s + p.dy, 9, '#ff4d6d'); g.globalAlpha = 1; }
  g.restore();
  if (state === 'play' || state === 'pause') drawUI();
  if (state === 'menu') card('Lucy’s Dog Dash', 40, [
    ['Help Jane walk Lucy safely', 20, INK], ['Swipe ← → to change lane', 17], ['Swipe up or tap to jump', 17],
    ['Swipe down to stop and wait', 17], ['Grab bones and power-ups', 17], ['Best: ' + best, 20, '#e09f00']], 'Tap to start', 440);
  if (state === 'pause') { pill(CX - 150, 676, 300, 76, 38); text('Paused', CX, 710, 24, INK); text('Tap or press P to resume', CX, 736, 15, SOFT); }
  if (state === 'over') card('Time to go home, Lucy!', 30, [
    ['Lucy is safe and wagging her tail', 17], ['Score  ' + score(), 34, INK], ['Bones  ' + G.treats, 18], ['Best  ' + best, 20, '#e09f00']], 'Play again', 440);
}

/* ---------- input ---------- */
function giveAsk() {
  const a = G.ask; if (!a) return;
  if (a.kind === 'treat') G.treats--;
  G.happy = Math.min(5, G.happy + 1); G.bonus += a.kind === 'treat' ? 50 : 25;
  for (let i = 0; i < 7; i++) G.parts.push({ dx: rnd(-40, 40), dy: rnd(-20, 10), life: rnd(0.8, 1.4) });
  say(a.kind === 'treat' ? 'Yum! Thank you!' : 'Happy Lucy!', 1.3);
  beep(660, 0.25, 'triangle', 0.08, 1100);
  G.ask = null; G.askT = rnd(14, 22); G.stopT = 0.4;
}
function act(a) {
  if (a === 'mute') { muted = !muted; try { localStorage.setItem('ldd_mute', muted ? '1' : '0'); } catch (e) {} return; }
  if (state === 'menu' || state === 'over') { if (a === 'jump') start(); return; }
  if (state === 'pause') { if (a === 'pause' || a === 'jump') state = 'play'; return; }
  if (a === 'left') { G.tlane = Math.max(0, G.tlane - 1); G.stopT = 0; }
  else if (a === 'right') { G.tlane = Math.min(2, G.tlane + 1); G.stopT = 0; }
  else if (a === 'stop') G.stopT = 1.2;
  else if ((a === 'jump' || a === 'give') && G.ask && G.stopF > 0.5) giveAsk();
  else if (a === 'jump' && G.jt < 0) { G.jt = 0; beep(300, 0.2, 'sine', 0.06, 650); }
  else if (a === 'pause') state = 'pause';
}
addEventListener('keydown', e => {
  const k = e.key, map = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
    ArrowDown: 'stop', s: 'stop', S: 'stop', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump', Enter: 'jump', p: 'pause', P: 'pause', Escape: 'pause', m: 'mute', M: 'mute', e: 'give', E: 'give' };
  if (map[k]) { e.preventDefault(); act(map[k]); }
});
let down = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.hypot(dx, dy) < 25) {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    if (x > W - 64 && y < 70) act('mute');
    else if (x > W - 124 && x <= W - 64 && y < 70 && state === 'play') act('pause');
    else act('jump');
  } else if (Math.abs(dx) > Math.abs(dy)) act(dx < 0 ? 'left' : 'right');
  else act(dy < 0 ? 'jump' : 'stop');
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const zt = (state === 'pause' || (state === 'play' && G.stopF > 0.7)) ? 1 : 0;
  zoomF += (zt - zoomF) * Math.min(1, dt * 5);
  update(dt); render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
